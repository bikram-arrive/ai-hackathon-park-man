<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PARKMAN by Arrive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1A1A1A; overflow: hidden; font-family: Arial, sans-serif; }

    /* HUD — sits above canvas (z 100), below overlays (z 200) */
    #hud {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 100;
    }
    #brand {
      color: #FF33BB; font-size: 22px; font-weight: 900;
      letter-spacing: 4px; text-shadow: 0 0 12px #FF33BB88;
    }
    #stats { display: flex; gap: 16px; }
    .stat {
      background: rgba(0,0,0,0.65); border: 1px solid #5F016F;
      border-radius: 6px; padding: 5px 14px;
      color: #F9F5F4; font-size: 11px; text-align: center; letter-spacing: 1px;
    }
    .stat span { display: block; font-size: 20px; font-weight: bold; color: #FF33BB; }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(10,0,15,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; color: #F9F5F4;
    }
    .overlay h1    { font-size: 68px; letter-spacing: 10px; margin-bottom: 6px; }
    .overlay .sub  { font-size: 16px; letter-spacing: 3px; margin-bottom: 28px; }
    .overlay .info { font-size: 20px; margin-bottom: 36px; text-align: center; line-height: 1.7; }
    .overlay .info span { color: #FF33BB; font-weight: bold; }
    .overlay button {
      background: #5F016F; color: #F9F5F4;
      border: 2px solid #FF33BB; padding: 13px 44px;
      font-size: 18px; border-radius: 8px; cursor: pointer;
      letter-spacing: 4px; text-transform: uppercase; transition: all 0.15s;
    }
    .overlay button:hover { background: #FF33BB; color: #1A1A1A; }
    .hint { margin-top: 18px; color: #888; font-size: 13px; letter-spacing: 1px; }
  </style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="brand">ARRIVE</div>
  <div id="stats">
    <div class="stat">SCORE<span id="hud-score">0</span></div>
    <div class="stat">SIGNS<span id="hud-signs">20</span></div>
    <div class="stat">SPEED<span id="hud-speed">1.0×</span></div>
  </div>
</div>

<!-- Start screen -->
<div id="screen-start" class="overlay">
  <h1 style="color:#FF33BB">PARKMAN</h1>
  <div class="sub" style="color:#FFADE4">by ARRIVE</div>
  <div class="info">
    Collect all <span>20 parking signs</span>.<br>
    Avoid the yellow <span>fines</span>!
  </div>
  <button id="btn-start">START</button>
  <div class="hint">WASD or Arrow Keys &nbsp;·&nbsp; turns at intersections</div>
</div>

<!-- Game-over / win screen -->
<div id="screen-end" class="overlay" style="display:none">
  <h1 id="end-title">GAME OVER</h1>
  <div class="sub" id="end-sub">You got fined!</div>
  <div class="info">Final Score: <span id="end-score">0</span></div>
  <button onclick="restartGame()">RETRY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';

// ── Pod B: Grid & Collision Utilities ─────────────────────────────────────────
// Defaults tuned to Pod C's grid: CELL=12, streets at -24/-12/0/12/24
const DEFAULTS = {
  cell:        12,
  roadEvery:   1,      // step = cell * roadEvery = 12 → snaps to STREETS values
  turnEpsilon: 0.5,
  worldLimit:  32,
};

function isRoadCell(ix, iz, roadEvery = DEFAULTS.roadEvery) {
  return ix % roadEvery === 0 || iz % roadEvery === 0;
}

function getIntersectionSnap(x, z, cell = DEFAULTS.cell, roadEvery = DEFAULTS.roadEvery) {
  const step = cell * roadEvery;
  return {
    x: Math.round(x / step) * step,
    z: Math.round(z / step) * step,
    step,
  };
}

function isAtIntersection(x, z, epsilon = DEFAULTS.turnEpsilon, cell = DEFAULTS.cell, roadEvery = DEFAULTS.roadEvery) {
  const snap = getIntersectionSnap(x, z, cell, roadEvery);
  const near = Math.abs(x - snap.x) < epsilon && Math.abs(z - snap.z) < epsilon;
  return { near, snapX: snap.x, snapZ: snap.z };
}

// heading and pendingTurn are {x, z} unit vectors (XZ plane)
function canApplyTurn(heading, pendingTurn) {
  const dot = heading.x * pendingTurn.x + heading.z * pendingTurn.z;
  if (dot === -1) return false;   // no U-turns
  return dot === 0;               // 90° turns only
}

function clampPosition(x, z, worldLimit = DEFAULTS.worldLimit) {
  const min = -worldLimit + 1;
  const max =  worldLimit - 1;
  return {
    x: Math.min(max, Math.max(min, x)),
    z: Math.min(max, Math.max(min, z)),
  };
}

function isAabbIntersect(a, b) {
  return (
    a.minX <= b.maxX && a.maxX >= b.minX &&
    a.minY <= b.maxY && a.maxY >= b.minY &&
    a.minZ <= b.maxZ && a.maxZ >= b.minZ
  );
}

// Pure state transition for sign collection; caller syncs result back to game vars
function applySignCollection(state) {
  const next = {
    ...state,
    score:          state.score + 10,
    signsCollected: state.signsCollected + 1,
    status:         'Parking sign acquired',
  };
  if (next.signsCollected % 5 === 0) {
    next.baseSpeed = Number((next.baseSpeed * 1.15).toFixed(10));
  }
  if (!next.gridlockSpawned && next.score >= 100) {
    next.gridlockSpawned = true;
    next.status = 'Gridlock event active';
  }
  return next;
}

function getGridlockCount(randomValue) {
  return 3 + Math.floor(randomValue * 3);   // 3–5 jams
}

// ── Game Constants ────────────────────────────────────────────────────────────
const CELL        = DEFAULTS.cell;
const NUM_STREETS = 5;
const HALF_GRID   = ((NUM_STREETS - 1) * CELL) / 2;   // 24
const BLDG_W      = 8;
const BASE_SPEED  = 0.10;
const TOTAL_SIGNS = 20;

const C_CAR    = 0x5F016F;
const C_ACCENT = 0xFF33BB;
const C_GROUND = 0x222222;
const C_ROAD   = 0x2D2D2D;
const C_BLDG   = 0xF9F5F4;
const C_BLDG2  = 0xFFADE4;
const C_ENEMY  = 0xFFD700;
const C_SIGN   = 0x0033AA;
const C_JAM    = 0xFF2200;

// Street world-space positions: [-24, -12, 0, 12, 24]
const STREETS = Array.from({ length: NUM_STREETS }, (_, i) => -HALF_GRID + i * CELL);

// ── Globals ───────────────────────────────────────────────────────────────────
let scene, camera, renderer;
let playerCar, playerDir, queueDir;          // contract: playerCar
let baseSpeed, score, signsLeft, gridlockDone;
let parkingSigns, enemyFines, jams;          // contract: parkingSigns, enemyFines
let gameState = 'menu';                      // contract: gameState

// ── Pod B wrappers ────────────────────────────────────────────────────────────
function snapX(x) { return getIntersectionSnap(x, 0).x; }
function snapZ(z) { return getIntersectionSnap(0, z).z; }
function atIntersection(x, z) { return isAtIntersection(x, z).near; }

function aabbOf(obj, halfW, halfH, halfD) {
  const p = obj.position;
  return {
    minX: p.x - halfW, maxX: p.x + halfW,
    minY: p.y - halfH, maxY: p.y + halfH,
    minZ: p.z - halfD, maxZ: p.z + halfD,
  };
}

// ── Scene init ────────────────────────────────────────────────────────────────
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0D0010);
  scene.fog = new THREE.FogExp2(0x0D0010, 0.014);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 28, 28);
  camera.lookAt(0, 0, 0);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function addLights() {
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);
  const purple = new THREE.PointLight(0x9900cc, 1.2, 80);
  purple.position.set(0, 10, 0);
  scene.add(purple);
}

// ── World ─────────────────────────────────────────────────────────────────────
function buildWorld() {
  const gnd = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshLambertMaterial({ color: C_GROUND })
  );
  gnd.rotation.x = -Math.PI / 2;
  gnd.receiveShadow = true;
  scene.add(gnd);

  const roadMat = new THREE.MeshLambertMaterial({ color: C_ROAD });
  STREETS.forEach(z => {
    const r = new THREE.Mesh(new THREE.PlaneGeometry(300, 4.4), roadMat);
    r.rotation.x = -Math.PI / 2;
    r.position.set(0, 0.02, z);
    scene.add(r);
  });
  STREETS.forEach(x => {
    const r = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 300), roadMat);
    r.rotation.x = -Math.PI / 2;
    r.position.set(x, 0.02, 0);
    scene.add(r);
  });

  const rng = mulberry32(42);
  for (let ci = 0; ci < NUM_STREETS - 1; ci++) {
    for (let ri = 0; ri < NUM_STREETS - 1; ri++) {
      const cx  = (STREETS[ci] + STREETS[ci + 1]) / 2;
      const cz  = (STREETS[ri] + STREETS[ri + 1]) / 2;
      const h   = 3 + rng() * 8;
      const col = rng() < 0.25 ? C_BLDG2 : C_BLDG;
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(BLDG_W, h, BLDG_W),
        new THREE.MeshLambertMaterial({ color: col })
      );
      b.position.set(cx, h / 2, cz);
      b.castShadow = true;
      scene.add(b);
    }
  }
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Player ────────────────────────────────────────────────────────────────────
function makePlayer() {
  playerCar = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.65, 2.8),
    new THREE.MeshLambertMaterial({ color: C_CAR })
  );
  body.position.y = 0.55;
  body.castShadow = true;
  playerCar.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.4, 1.5),
    new THREE.MeshLambertMaterial({ color: C_ACCENT })
  );
  cabin.position.set(0, 1.0, -0.2);
  playerCar.add(cabin);

  const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.28, 10);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  [[-0.88, 0.32, 1.0], [0.88, 0.32, 1.0],
   [-0.88, 0.32, -1.0], [0.88, 0.32, -1.0]].forEach(([x, y, z]) => {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, y, z);
    playerCar.add(w);
  });

  const hlGeo = new THREE.BoxGeometry(0.28, 0.14, 0.08);
  const hlMat = new THREE.MeshLambertMaterial({ color: 0xFFFFCC, emissive: 0x888844 });
  [-0.52, 0.52].forEach(ox => {
    const hl = new THREE.Mesh(hlGeo, hlMat);
    hl.position.set(ox, 0.55, 1.38);
    playerCar.add(hl);
  });

  playerCar.position.set(0, 0, 0);
  scene.add(playerCar);

  playerDir = new THREE.Vector3(1, 0, 0);
  queueDir  = null;
}

// ── Parking Signs ─────────────────────────────────────────────────────────────
function makeSign(x, z) {
  const g = new THREE.Group();

  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.07, 1.3, 8),
    new THREE.MeshLambertMaterial({ color: 0x999999 })
  );
  pole.position.y = 0.65;
  g.add(pole);

  const board = new THREE.Mesh(
    new THREE.BoxGeometry(0.65, 0.65, 0.08),
    new THREE.MeshLambertMaterial({ color: C_SIGN })
  );
  board.position.y = 1.4;
  g.add(board);

  const pv = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.42, 0.10),
    new THREE.MeshLambertMaterial({ color: 0xffffff })
  );
  pv.position.set(-0.05, 1.4, 0.05);
  g.add(pv);

  g.position.set(x, 0, z);
  g.userData.active = true;
  scene.add(g);
  return g;
}

// spawnSigns — called inside startGame() (init) as required
function spawnSigns(rng) {
  parkingSigns = [];
  const candidates = [];

  for (let ri = 0; ri < NUM_STREETS; ri++)
    for (let ci = 0; ci < NUM_STREETS - 1; ci++)
      candidates.push([(STREETS[ci] + STREETS[ci + 1]) / 2, STREETS[ri]]);

  for (let ci = 0; ci < NUM_STREETS; ci++)
    for (let ri = 0; ri < NUM_STREETS - 1; ri++)
      candidates.push([STREETS[ci], (STREETS[ri] + STREETS[ri + 1]) / 2]);

  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  for (let i = 0; i < TOTAL_SIGNS; i++) {
    parkingSigns.push(makeSign(candidates[i][0], candidates[i][1]));
  }
}

// ── Enemy Fines ("Swedish Fines") ─────────────────────────────────────────────

// createParkingFine — Pod C visual model; populates enemyFines array
function createParkingFine() {
  const g   = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: C_ENEMY, emissive: 0x886600 });
  const geo = new THREE.BoxGeometry(1.3, 0.09, 0.85);
  const p1  = new THREE.Mesh(geo, mat); p1.rotation.z =  0.25; g.add(p1);
  const p2  = new THREE.Mesh(geo, mat); p2.rotation.z = -0.25; p2.position.y = 0.05; g.add(p2);
  g.position.y = 1.3;
  return g;
}

function spawnEnemyFines() {
  enemyFines = [];

  // Patroller 1 — sweeps horizontally along row index 1
  const e1 = createParkingFine();
  e1.position.set(STREETS[0], 1.3, STREETS[1]);
  e1.userData = {
    type: 'patroller',
    wps:  [
      new THREE.Vector3(STREETS[0],             1.3, STREETS[1]),
      new THREE.Vector3(STREETS[NUM_STREETS-1], 1.3, STREETS[1]),
    ],
    wi: 0, spd: 0.055,
  };
  scene.add(e1); enemyFines.push(e1);

  // Patroller 2 — sweeps vertically along column index 3
  const e2 = createParkingFine();
  e2.position.set(STREETS[3], 1.3, STREETS[0]);
  e2.userData = {
    type: 'patroller',
    wps:  [
      new THREE.Vector3(STREETS[3], 1.3, STREETS[0]),
      new THREE.Vector3(STREETS[3], 1.3, STREETS[NUM_STREETS-1]),
    ],
    wi: 0, spd: 0.055,
  };
  scene.add(e2); enemyFines.push(e2);

  // Chaser — hunts playerCar along street axes every frame
  const e3 = createParkingFine();
  e3.position.set(STREETS[NUM_STREETS-1], 1.3, STREETS[NUM_STREETS-1]);
  e3.userData = { type: 'chaser', spd: 0.045 };
  scene.add(e3); enemyFines.push(e3);
}

// updateEnemyFines — moves all enemyFines toward playerCar every frame
function updateEnemyFines(t) {
  for (const e of enemyFines) {
    const ud = e.userData;

    if (ud.type === 'patroller') {
      const target = ud.wps[ud.wi];
      const diff   = new THREE.Vector3().subVectors(target, e.position);
      diff.y = 0;
      if (diff.length() < 0.4) {
        ud.wi = (ud.wi + 1) % ud.wps.length;
      } else {
        diff.normalize().multiplyScalar(ud.spd);
        e.position.add(diff);
      }
    } else {
      // Chaser: advance along dominant axis toward playerCar each frame
      const dx = playerCar.position.x - e.position.x;
      const dz = playerCar.position.z - e.position.z;
      if (Math.abs(dx) >= Math.abs(dz)) {
        e.position.x += Math.sign(dx) * ud.spd;
        e.position.z  = snapZ(e.position.z);
      } else {
        e.position.z += Math.sign(dz) * ud.spd;
        e.position.x  = snapX(e.position.x);
      }
    }

    e.position.y  = 1.2 + Math.sin(t * 2.4 + e.position.x * 0.3) * 0.18;
    e.rotation.y += 0.025;
  }
}

// ── Traffic Jams ──────────────────────────────────────────────────────────────
function spawnGridlock(rng) {
  if (gridlockDone) return;
  gridlockDone = true;
  jams = [];

  const segs = [];
  for (let ri = 0; ri < NUM_STREETS; ri++)
    for (let ci = 0; ci < NUM_STREETS - 1; ci++)
      segs.push([(STREETS[ci] + STREETS[ci+1]) / 2, STREETS[ri]]);
  for (let ci = 0; ci < NUM_STREETS; ci++)
    for (let ri = 0; ri < NUM_STREETS - 1; ri++)
      segs.push([STREETS[ci], (STREETS[ri] + STREETS[ri+1]) / 2]);

  for (let i = segs.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [segs[i], segs[j]] = [segs[j], segs[i]];
  }

  const count = getGridlockCount(rng());
  for (let i = 0; i < count; i++) {
    const [x, z] = segs[i];
    const jam = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 1.6, 1.6),
      new THREE.MeshLambertMaterial({ color: C_JAM, emissive: 0x440000 })
    );
    jam.position.set(x, 0.8, z);
    scene.add(jam);
    jams.push(jam);
  }
}

// ── Collision Detection ───────────────────────────────────────────────────────
// checkCollisions — called every frame inside the animate (loop) function
function checkCollisions(rng) {
  const carBox = aabbOf(playerCar, 0.85, 0.60, 1.40);

  // Sign collection — uses Pod B applySignCollection() for pure state transition
  for (const s of parkingSigns) {
    if (!s.userData.active) continue;
    if (!isAabbIntersect(carBox, aabbOf(s, 0.55, 1.40, 0.55))) continue;

    s.userData.active = false;
    scene.remove(s);

    const st = applySignCollection({
      score,
      signsCollected: TOTAL_SIGNS - signsLeft,  // signs collected before this one
      baseSpeed,
      gridlockSpawned: gridlockDone,
    });

    const prevSpeed = baseSpeed;
    score     = st.score;
    baseSpeed = st.baseSpeed;
    signsLeft -= 1;

    sfxPickup();
    if (baseSpeed !== prevSpeed) sfxSpeedUp();   // speed-ramp every 5 signs

    if (st.gridlockSpawned && !gridlockDone) {
      spawnGridlock(rng);
      sfxGridlock();
    }
    gridlockDone = st.gridlockSpawned;

    updateHUD();
    if (signsLeft <= 0) { endGame('win'); return; }
  }

  // Enemy fine hit — any overlap ends the game
  for (const e of enemyFines) {
    if (isAabbIntersect(carBox, aabbOf(e, 0.80, 0.80, 0.80))) {
      endGame('over'); return;
    }
  }

  // Traffic jam hit
  for (const j of jams) {
    if (isAabbIntersect(carBox, aabbOf(j, 0.80, 0.80, 0.80))) {
      endGame('over'); return;
    }
  }
}

// ── Player Movement ───────────────────────────────────────────────────────────
function updatePlayer() {
  const px = playerCar.position.x;
  const pz = playerCar.position.z;

  // Apply queued direction at any intersection — all roads connect here,
  // so every direction (including U-turns) is valid.
  // Queue is kept alive until the car actually reaches an intersection,
  // so pressing a key between intersections always takes effect at the next one.
  if (queueDir && atIntersection(px, pz)) {
    const { snapX: sx, snapZ: sz } = isAtIntersection(px, pz);
    playerCar.position.x = sx;
    playerCar.position.z = sz;
    playerDir = queueDir.clone();
    queueDir  = null;
  }

  playerCar.position.x += playerDir.x * baseSpeed;
  playerCar.position.z += playerDir.z * baseSpeed;

  if (Math.abs(playerDir.x) > 0) {
    playerCar.position.z = snapZ(playerCar.position.z);
  } else {
    playerCar.position.x = snapX(playerCar.position.x);
  }

  // Pac-Man style wrap at grid edges
  const edge = HALF_GRID + CELL * 0.5;
  if (playerCar.position.x >  edge) playerCar.position.x = -HALF_GRID;
  if (playerCar.position.x < -edge) playerCar.position.x =  HALF_GRID;
  if (playerCar.position.z >  edge) playerCar.position.z = -HALF_GRID;
  if (playerCar.position.z < -edge) playerCar.position.z =  HALF_GRID;

  if      (playerDir.x >  0) playerCar.rotation.y = -Math.PI / 2;
  else if (playerDir.x <  0) playerCar.rotation.y =  Math.PI / 2;
  else if (playerDir.z >  0) playerCar.rotation.y =  0;
  else                        playerCar.rotation.y =  Math.PI;
}

// ── Camera ────────────────────────────────────────────────────────────────────
function updateCamera() {
  const back   = playerDir.clone().multiplyScalar(-13);
  const target = playerCar.position.clone().add(new THREE.Vector3(back.x, 11, back.z));
  camera.position.lerp(target, 0.07);
  camera.lookAt(playerCar.position.x, 0, playerCar.position.z);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-signs').textContent = signsLeft;
  document.getElementById('hud-speed').textContent = (baseSpeed / BASE_SPEED).toFixed(1) + '×';
}

// ── Audio (Web Audio API — no external files) ─────────────────────────────────
let _audioCtx = null;
function audioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function _tone(ctx, freq, type, start, dur, vol, freqEnd) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, start + dur);
  gain.gain.setValueAtTime(vol, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
  osc.start(start);
  osc.stop(start + dur + 0.01);
}

// Bip-boop: two-note rising blip when a sign is collected
function sfxPickup() {
  const ctx = audioCtx();
  const t   = ctx.currentTime;
  _tone(ctx, 520, 'square',   t,        0.06, 0.25);
  _tone(ctx, 900, 'square',   t + 0.07, 0.10, 0.25);
}

// Engine hum: subtle continuous rumble while driving
let _engineOsc = null, _engineGain = null;
function sfxEngineStart() {
  if (_engineOsc) return;
  const ctx    = audioCtx();
  _engineGain  = ctx.createGain();
  _engineGain.gain.setValueAtTime(0.04, ctx.currentTime);
  _engineGain.connect(ctx.destination);
  _engineOsc   = ctx.createOscillator();
  _engineOsc.type = 'sawtooth';
  _engineOsc.frequency.setValueAtTime(55, ctx.currentTime);
  _engineOsc.connect(_engineGain);
  _engineOsc.start();
}
function sfxEngineStop() {
  if (!_engineOsc) return;
  _engineGain.gain.setValueAtTime(0.04, _audioCtx.currentTime);
  _engineGain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.3);
  _engineOsc.stop(_audioCtx.currentTime + 0.35);
  _engineOsc = null; _engineGain = null;
}
function sfxEngineUpdate(speed) {
  if (!_engineOsc) return;
  // Pitch rises with speed: 55 Hz at base → 110 Hz at 2× speed
  _engineOsc.frequency.setValueAtTime(55 + speed * 200, _audioCtx.currentTime);
}

// Gridlock alert: siren-style warning
function sfxGridlock() {
  const ctx = audioCtx();
  const t   = ctx.currentTime;
  [0, 0.18, 0.36].forEach(offset => {
    _tone(ctx, 660, 'sawtooth', t + offset,        0.15, 0.35);
    _tone(ctx, 440, 'sawtooth', t + offset + 0.15, 0.15, 0.35);
  });
}

// Game over: descending wail
function sfxGameOver() {
  const ctx = audioCtx();
  const t   = ctx.currentTime;
  _tone(ctx, 400, 'sawtooth', t,        0.18, 0.4, 150);
  _tone(ctx, 200, 'sawtooth', t + 0.20, 0.18, 0.4, 80);
  _tone(ctx, 100, 'sawtooth', t + 0.42, 0.40, 0.4, 60);
}

// Win fanfare: four-note ascending arpeggio
function sfxWin() {
  const ctx = audioCtx();
  const t   = ctx.currentTime;
  [523, 659, 784, 1047].forEach((f, i) => {
    _tone(ctx, f, 'square', t + i * 0.13, 0.16, 0.28);
  });
}

// Speed-ramp ding: short high beep every 5 signs
function sfxSpeedUp() {
  const ctx = audioCtx();
  const t   = ctx.currentTime;
  _tone(ctx, 1200, 'square', t,        0.05, 0.2);
  _tone(ctx, 1600, 'square', t + 0.06, 0.08, 0.2);
}

// ── Input ─────────────────────────────────────────────────────────────────────
const KEY_DIR = {
  ArrowUp:    new THREE.Vector3( 0, 0, -1),
  KeyW:       new THREE.Vector3( 0, 0, -1),
  ArrowDown:  new THREE.Vector3( 0, 0,  1),
  KeyS:       new THREE.Vector3( 0, 0,  1),
  ArrowLeft:  new THREE.Vector3(-1, 0,  0),
  KeyA:       new THREE.Vector3(-1, 0,  0),
  ArrowRight: new THREE.Vector3( 1, 0,  0),
  KeyD:       new THREE.Vector3( 1, 0,  0),
};
document.addEventListener('keydown', e => {
  if (KEY_DIR[e.code]) {
    e.preventDefault();
    if (gameState === 'playing') queueDir = KEY_DIR[e.code].clone();
  }
});

// ── Game Flow ─────────────────────────────────────────────────────────────────
let _rng;

function startGame() {
  while (scene.children.length) scene.remove(scene.children[0]);
  addLights();

  score        = 0;
  signsLeft    = TOTAL_SIGNS;
  baseSpeed    = BASE_SPEED;
  gridlockDone = false;
  jams         = [];
  _rng         = mulberry32(Date.now() | 0);

  buildWorld();
  makePlayer();
  spawnSigns(_rng);        // called inside init (startGame) as required
  spawnEnemyFines();
  updateHUD();
  sfxEngineStart();

  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-end').style.display   = 'none';
  gameState = 'playing';
}

function endGame(type) {
  gameState = 'over';
  sfxEngineStop();
  document.getElementById('end-score').textContent = score;
  if (type === 'win') {
    sfxWin();
    document.getElementById('end-title').textContent = 'YOU WIN!';
    document.getElementById('end-title').style.color = '#FF33BB';
    document.getElementById('end-sub').textContent   = 'All parking signs collected!';
  } else {
    sfxGameOver();
    document.getElementById('end-title').textContent = 'GAME OVER';
    document.getElementById('end-title').style.color = '#FFD700';
    document.getElementById('end-sub').textContent   = 'You got fined!';
  }
  document.getElementById('screen-end').style.display = 'flex';
}

function restartGame() { startGame(); }

// ── Main Loop (animate) ───────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now() * 0.001;

  if (gameState === 'playing') {
    updatePlayer();
    updateEnemyFines(t);    // Swedish Fines move toward playerCar every frame
    checkCollisions(_rng);  // called inside animate loop as required
    updateCamera();
    sfxEngineUpdate(baseSpeed / BASE_SPEED);
  }

  renderer.render(scene, camera);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
initScene();
addLights();
buildWorld();   // render city behind the start screen
loop();

document.getElementById('btn-start').addEventListener('click', startGame);
</script>
